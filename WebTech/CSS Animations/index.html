<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice Animations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-div">
        <div class="bg"></div>
        <div class="container">
            <div class="anim-card">
                <div id="anim1"></div>
            </div>
            <div class="anim-card">
                <div id="anim2"></div>
            </div>
            <div class="anim-card">
                <div id="anim3"></div>
            </div>
            <div class="anim-card" id="Anim3D1">
                <div id="bg-anim4"></div>
                <div id="anim4"></div>
            </div>
            <div class="anim-card" id="Anim3D2">
                <div id="bg-anim5"></div>
                <div id="cube">
                    <div id="front"></div>
                    <div id="back"></div>
                    <div id="top"></div>
                    <div id="bottom"></div>
                    <div id="left"></div>
                    <div id="right"></div>
                </div>
            </div>
            <div class="anim-card" id="hover"></div>
            <div class="anim-card" id="img-mask1">
                <div id="mask-layer">
                    <img src="img1.jpg" alt="an image resembling something you would see in the mortal engines series" id="img1">
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
